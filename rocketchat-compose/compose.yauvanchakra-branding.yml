# Yauvanchakra branding overlay for the official Rocket.Chat image.
# Start it last so these settings override the base compose file:
#   docker compose -f compose.monitoring.yml -f compose.traefik.yml -f compose.database.yml -f compose.yml -f compose.nats.yml -f docker.yml -f compose.yauvanchakra-branding.yml up -d

services:
  rocketchat:
    environment:
      OVERWRITE_SETTING_Site_Name: ${YAUVANCHAKRA_SITE_NAME:-Yauvanchakra}
      OVERWRITE_SETTING_Organization_Name: ${YAUVANCHAKRA_ORG_NAME:-Yauvanchakra}
      OVERWRITE_SETTING_Layout_Home_Title: ${YAUVANCHAKRA_HOME_TITLE:-Home}
      OVERWRITE_SETTING_Layout_Sidenav_Footer: ${YAUVANCHAKRA_SIDENAV_FOOTER:-<a href="/home" style="color:inherit;text-decoration:none;line-height:1.25"><div style="font-weight:600;font-size:14px">Yauvanchakra</div><div style="font-weight:400;font-size:11px;opacity:.75">powered by beathah</div></a>}
      OVERWRITE_SETTING_Layout_Sidenav_Footer_Dark: ${YAUVANCHAKRA_SIDENAV_FOOTER_DARK:-<a href="/home" style="color:#fff;text-decoration:none;line-height:1.25"><div style="font-weight:600;font-size:14px">Yauvanchakra</div><div style="font-weight:400;font-size:11px;opacity:.75">powered by beathah</div></a>}
      OVERWRITE_SETTING_theme-custom-css: |-
        footer.rcx-sidebar-footer a[href*="rocket.chat"],
        .rcx-sidebar-footer a[href*="rocket.chat"] { display: none !important; }
        img[src*="/images/logo/logo"],
        img[alt="Logo"][src*="logo.svg"],
        a[href*="rocket.chat"] { display: none !important; }
      OVERWRITE_SETTING_Custom_Script_Logged_Out: |
        (function () {
          if (window.__yauvanchakraLoginBranding) return;
          window.__yauvanchakraLoginBranding = true;
          function brandLogin() {
            try {
              document.querySelectorAll('img[src*="/images/logo/logo"], img[alt="Logo"][src*="logo"]').forEach(function (img) {
                if (img.dataset.yauvanchakraReplaced) return;
                img.dataset.yauvanchakraReplaced = "1";
                img.style.display = "none";
                var label = document.createElement("div");
                label.textContent = "Yauvanchakra";
                label.style.cssText = "font-weight:700;font-size:22px;line-height:1.2;color:inherit";
                if (img.parentNode) img.parentNode.insertBefore(label, img);
              });
              document.querySelectorAll('a[href*="rocket.chat"]').forEach(function (a) {
                var box = a.parentElement;
                if (box && !box.dataset.yauvanchakraPowered) {
                  box.dataset.yauvanchakraPowered = "1";
                  box.textContent = "Yauvanchakra";
                } else {
                  a.style.display = "none";
                }
              });
              var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
              var node;
              while ((node = walker.nextNode())) {
                var v = node.nodeValue;
                if (!v) continue;
                if (v.indexOf("Powered by") !== -1 || v.indexOf("Rocket.Chat") !== -1 || v.indexOf("D-Origin") !== -1) {
                  node.nodeValue = "Yauvanchakra";
                }
              }
            } catch (e) {}
          }
          brandLogin();
          new MutationObserver(brandLogin).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        })();
      OVERWRITE_SETTING_Custom_Script_Logged_In: |
        (function () {
          if (window.__yauvanchakraBrandingApplied) return;
          window.__yauvanchakraBrandingApplied = true;
          var replacements = {
            "Powered by Rocket.Chat": "Yauvanchakra",
            "D-Origin powered by beathah": "Yauvanchakra",
            "D-Origin": "Yauvanchakra",
            "Take Rocket.Chat with you with mobile applications.": "Take Yauvanchakra with you with mobile applications.",
            "Install Rocket.Chat on your preferred desktop platform.": "Install Yauvanchakra on your preferred desktop platform.",
            "Learn how to unlock the myriad possibilities of Rocket.Chat.": "Learn how to unlock the myriad possibilities of Yauvanchakra.",
            "Rocket.Chat": "Yauvanchakra"
          };
          function replaceTextNodes(root) {
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            var node;
            while ((node = walker.nextNode())) {
              var value = node.nodeValue;
              if (!value || !value.trim()) continue;
              var next = value;
              Object.keys(replacements).forEach(function (from) {
                if (next.indexOf(from) !== -1) next = next.split(from).join(replacements[from]);
              });
              if (next !== value) node.nodeValue = next;
            }
          }
          function apply() {
            try { replaceTextNodes(document.body); } catch (e) {}
          }
          apply();
          new MutationObserver(function () { apply(); }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        })();
