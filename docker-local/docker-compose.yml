volumes:
  mongodb_data:

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongodb-init:
    image: mongo:8.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongodb --eval "
          try {
            rs.status();
            print('Replica set already initialized');
          } catch (e) {
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
            print('Replica set initialized');
          }
        "

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:8.0.0
    restart: unless-stopped
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
    environment:
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      MONGO_OPLOG_URL: mongodb://mongodb:27017/local?replicaSet=rs0
      ROOT_URL: http://localhost:3000
      PORT: 3000
      DEPLOY_METHOD: docker
      OVERWRITE_SETTING_Show_Setup_Wizard: "true"
      OVERWRITE_SETTING_Site_Name: D-Origin
      OVERWRITE_SETTING_Organization_Name: D-Origin
      OVERWRITE_SETTING_Layout_Sidenav_Footer: '<a href="/home" style="color:inherit;text-decoration:none;line-height:1.25"><div style="font-weight:600;font-size:14px">D-Origin</div><div style="font-weight:400;font-size:11px;opacity:.75">powered by beathah</div></a>'
      OVERWRITE_SETTING_Layout_Sidenav_Footer_Dark: '<a href="/home" style="color:#fff;text-decoration:none;line-height:1.25"><div style="font-weight:600;font-size:14px">D-Origin</div><div style="font-weight:400;font-size:11px;opacity:.75">powered by beathah</div></a>'
      OVERWRITE_SETTING_theme-custom-css: 'footer.rcx-sidebar-footer a[href*="rocket.chat"],.rcx-sidebar-footer a[href*="rocket.chat"]{display:none!important}'
      OVERWRITE_SETTING_Custom_Script_Logged_In: |
        (function () {
          if (window.__doriginBrandingApplied) return;
          window.__doriginBrandingApplied = true;
          var replacements = {
            "Powered by Rocket.Chat": "D-Origin powered by beathah",
            "Take Rocket.Chat with you with mobile applications.": "Take D-Origin with you with mobile applications.",
            "Install Rocket.Chat on your preferred desktop platform.": "Install D-Origin on your preferred desktop platform.",
            "Learn how to unlock the myriad possibilities of Rocket.Chat.": "Learn how to unlock the myriad possibilities of D-Origin."
          };
          function replaceTextNodes(root) {
            var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
            var node;
            while ((node = walker.nextNode())) {
              var value = node.nodeValue;
              if (!value || !value.trim()) continue;
              var next = value;
              Object.keys(replacements).forEach(function (from) {
                if (next.indexOf(from) !== -1) next = next.split(from).join(replacements[from]);
              });
              if (next !== value) node.nodeValue = next;
            }
          }
          function apply() { try { replaceTextNodes(document.body); } catch (e) {} }
          apply();
          new MutationObserver(function () { apply(); }).observe(document.documentElement, { childList: true, subtree: true, characterData: true });
        })();
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/info',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
